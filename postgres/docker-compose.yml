services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quan_ly_chi_nhanh}
      POSTGRES_USER: ${POSTGRES_USER:-techstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MyPass@2025}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d
    networks:
      - db-cluster
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techstore} -d ${POSTGRES_DB:-quan_ly_chi_nhanh}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - db-cluster

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-api
    restart: unless-stopped
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-techstore}
      DB_PASSWORD: ${DB_PASSWORD:-MyPass@2025}
      DB_NAME: ${DB_NAME:-quan_ly_chi_nhanh}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      BRANCH_CN01_DB_HOST: ${BRANCH_CN01_DB_HOST:-}
      BRANCH_CN01_DB_ENGINE: ${BRANCH_CN01_DB_ENGINE:-postgresql}
      BRANCH_CN01_DB_PORT: ${BRANCH_CN01_DB_PORT:-5432}
      BRANCH_CN01_DB_NAME: ${BRANCH_CN01_DB_NAME:-}
      BRANCH_CN01_DB_USER: ${BRANCH_CN01_DB_USER:-}
      BRANCH_CN01_DB_PASSWORD: ${BRANCH_CN01_DB_PASSWORD:-}
      BRANCH_CN02_DB_HOST: ${BRANCH_CN02_DB_HOST:-}
      BRANCH_CN02_DB_ENGINE: ${BRANCH_CN02_DB_ENGINE:-postgresql}
      BRANCH_CN02_DB_PORT: ${BRANCH_CN02_DB_PORT:-5432}
      BRANCH_CN02_DB_NAME: ${BRANCH_CN02_DB_NAME:-}
      BRANCH_CN02_DB_USER: ${BRANCH_CN02_DB_USER:-}
      BRANCH_CN02_DB_PASSWORD: ${BRANCH_CN02_DB_PASSWORD:-}
    ports:
      - "${FLASK_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - db-cluster

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-client
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - db-cluster

volumes:
  postgres-data:
  redis-data:

networks:
  db-cluster:
    driver: bridge
