services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-MyPass@2025}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./init/mssql:/docker-entrypoint-initdb.d
    networks:
      - db-cluster
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD:-MyPass@2025}" -C -Q "SELECT 1" -b
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./init/mssql:/scripts
    networks:
      - db-cluster
    entrypoint: >
      bash -c "
        echo 'Initializing database...' &&
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P '${DB_PASSWORD:-MyPass@2025}' -C -i /scripts/01-schema-and-data.sql &&
        echo 'Database is ready.'
      "

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - db-cluster

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-api
    restart: unless-stopped
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      DB_HOST: ${DB_HOST:-sqlserver}
      DB_PORT: ${DB_PORT:-1433}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-MyPass@2025}
      DB_NAME: ${DB_NAME:-quan_ly_chi_nhanh}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      BRANCH_CN01_DB_HOST: ${BRANCH_CN01_DB_HOST:-}
      BRANCH_CN01_DB_ENGINE: ${BRANCH_CN01_DB_ENGINE:-sqlserver}
      BRANCH_CN01_DB_PORT: ${BRANCH_CN01_DB_PORT:-1433}
      BRANCH_CN01_DB_NAME: ${BRANCH_CN01_DB_NAME:-}
      BRANCH_CN01_DB_USER: ${BRANCH_CN01_DB_USER:-}
      BRANCH_CN01_DB_PASSWORD: ${BRANCH_CN01_DB_PASSWORD:-}
      BRANCH_CN02_DB_HOST: ${BRANCH_CN02_DB_HOST:-}
      BRANCH_CN02_DB_ENGINE: ${BRANCH_CN02_DB_ENGINE:-sqlserver}
      BRANCH_CN02_DB_PORT: ${BRANCH_CN02_DB_PORT:-1433}
      BRANCH_CN02_DB_NAME: ${BRANCH_CN02_DB_NAME:-}
      BRANCH_CN02_DB_USER: ${BRANCH_CN02_DB_USER:-}
      BRANCH_CN02_DB_PASSWORD: ${BRANCH_CN02_DB_PASSWORD:-}
    ports:
      - "${FLASK_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
    depends_on:
      mssql-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - db-cluster

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-client
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - db-cluster

volumes:
  mssql-data:
  redis-data:

networks:
  db-cluster:
    driver: bridge
