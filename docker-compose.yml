services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-MyPass@2025}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./init/mssql:/docker-entrypoint-initdb.d
    networks:
      - db-cluster
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD:-MyPass@2025}" -C -Q "SELECT 1" -b
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./init/mssql:/scripts
    networks:
      - db-cluster
    entrypoint: >
      bash -c "
        echo 'Initializing database...' &&
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P '${DB_PASSWORD:-MyPass@2025}' -C -b -i /scripts/01-schema-and-data.sql &&
        echo 'Database is ready.'
      "

  mysql:
    image: mysql:8.4
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootPass@2025}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quan_ly_chi_nhanh}
      MYSQL_USER: ${MYSQL_USER:-techstore}
      MYSQL_PASSWORD: ${DB_PASSWORD:-MyPass@2025}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init/mysql:/docker-entrypoint-initdb.d
    networks:
      - db-cluster
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER:-techstore} -p${DB_PASSWORD:-MyPass@2025} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quan_ly_chi_nhanh}
      POSTGRES_USER: ${POSTGRES_USER:-techstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MyPass@2025}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d
    networks:
      - db-cluster
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techstore} -d ${POSTGRES_DB:-quan_ly_chi_nhanh}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - db-cluster

  tru-so-backend:
    build:
      context: ./tru_so/backend
      dockerfile: Dockerfile
    container_name: tru-so-backend
    restart: unless-stopped
    environment:
      APP_ROLE: central
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      DB_ENGINE: ${DB_ENGINE:-sqlserver}
      DB_HOST: ${DB_HOST:-sqlserver}
      DB_PORT: ${DB_PORT:-1433}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-MyPass@2025}
      DB_NAME: ${DB_NAME:-quan_ly_chi_nhanh}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SERVICE_API_URL: ${TRU_SO_SERVICE_URL:-http://tru-so-service:5000}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token-change-in-production}
      BRANCH_CN01_API_URL: ${BRANCH_CN01_API_URL:-http://mysql-backend:5000}
      BRANCH_CN02_API_URL: ${BRANCH_CN02_API_URL:-http://postgre-backend:5000}
      BRANCH_CN01_SERVICE_URL: ${BRANCH_CN01_SERVICE_URL:-http://mysql-service:5000}
      BRANCH_CN02_SERVICE_URL: ${BRANCH_CN02_SERVICE_URL:-http://postgre-service:5000}
      BRANCH_CN01_DB_HOST: ${BRANCH_CN01_DB_HOST:-mysql}
      BRANCH_CN01_DB_ENGINE: ${BRANCH_CN01_DB_ENGINE:-mysql}
      BRANCH_CN01_DB_PORT: ${BRANCH_CN01_DB_PORT:-3306}
      BRANCH_CN01_DB_NAME: ${BRANCH_CN01_DB_NAME:-quan_ly_chi_nhanh}
      BRANCH_CN01_DB_USER: ${BRANCH_CN01_DB_USER:-techstore}
      BRANCH_CN01_DB_PASSWORD: ${BRANCH_CN01_DB_PASSWORD:-MyPass@2025}
      BRANCH_CN02_DB_HOST: ${BRANCH_CN02_DB_HOST:-postgres}
      BRANCH_CN02_DB_ENGINE: ${BRANCH_CN02_DB_ENGINE:-postgresql}
      BRANCH_CN02_DB_PORT: ${BRANCH_CN02_DB_PORT:-5432}
      BRANCH_CN02_DB_NAME: ${BRANCH_CN02_DB_NAME:-quan_ly_chi_nhanh}
      BRANCH_CN02_DB_USER: ${BRANCH_CN02_DB_USER:-techstore}
      BRANCH_CN02_DB_PASSWORD: ${BRANCH_CN02_DB_PASSWORD:-MyPass@2025}
    ports:
      - "${CENTRAL_API_PORT:-5000}:5000"
    volumes:
      - ./tru_so/backend:/app
    depends_on:
      mssql-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - db-cluster

  mysql-backend:
    build:
      context: ./mysql/backend
      dockerfile: Dockerfile
    container_name: mysql-backend
    restart: unless-stopped
    environment:
      APP_ROLE: branch
      BRANCH_CODE: CN01
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      DB_ENGINE: ${BRANCH_CN01_DB_ENGINE:-mysql}
      DB_HOST: ${BRANCH_CN01_DB_HOST:-mysql}
      DB_PORT: ${BRANCH_CN01_DB_PORT:-3306}
      DB_NAME: ${BRANCH_CN01_DB_NAME:-quan_ly_chi_nhanh}
      DB_USER: ${BRANCH_CN01_DB_USER:-techstore}
      DB_PASSWORD: ${BRANCH_CN01_DB_PASSWORD:-MyPass@2025}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token-change-in-production}
    ports:
      - "${CN01_API_PORT:-5001}:5000"
    volumes:
      - ./mysql/backend:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - db-cluster

  postgre-backend:
    build:
      context: ./postgre/backend
      dockerfile: Dockerfile
    container_name: postgre-backend
    restart: unless-stopped
    environment:
      APP_ROLE: branch
      BRANCH_CODE: CN02
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      DB_ENGINE: ${BRANCH_CN02_DB_ENGINE:-postgresql}
      DB_HOST: ${BRANCH_CN02_DB_HOST:-postgres}
      DB_PORT: ${BRANCH_CN02_DB_PORT:-5432}
      DB_NAME: ${BRANCH_CN02_DB_NAME:-quan_ly_chi_nhanh}
      DB_USER: ${BRANCH_CN02_DB_USER:-techstore}
      DB_PASSWORD: ${BRANCH_CN02_DB_PASSWORD:-MyPass@2025}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token-change-in-production}
    ports:
      - "${CN02_API_PORT:-5002}:5000"
    volumes:
      - ./postgre/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - db-cluster

  tru-so-service:
    build:
      context: ./tru_so/service
      dockerfile: Dockerfile
    container_name: tru-so-service
    restart: unless-stopped
    environment:
      SYSTEM_NAME: tru_so
      BACKEND_API_URL: http://tru-so-backend:5000
      PEER_SERVICE_URLS: mysql=http://mysql-service:5000,postgre=http://postgre-service:5000
      BRANCH_SERVICE_MAP: ${BRANCH_SERVICE_MAP:-CN01=mysql,CN02=postgre}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token-change-in-production}
    ports:
      - "${TRU_SO_SERVICE_PORT:-5010}:5000"
    depends_on:
      - tru-so-backend
    networks:
      - db-cluster

  mysql-service:
    build:
      context: ./mysql/service
      dockerfile: Dockerfile
    container_name: mysql-service
    restart: unless-stopped
    environment:
      SYSTEM_NAME: mysql
      BACKEND_API_URL: http://mysql-backend:5000
      PEER_SERVICE_URLS: tru_so=http://tru-so-service:5000,postgre=http://postgre-service:5000
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token-change-in-production}
    ports:
      - "${MYSQL_SERVICE_PORT:-5011}:5000"
    depends_on:
      - mysql-backend
    networks:
      - db-cluster

  postgre-service:
    build:
      context: ./postgre/service
      dockerfile: Dockerfile
    container_name: postgre-service
    restart: unless-stopped
    environment:
      SYSTEM_NAME: postgre
      BACKEND_API_URL: http://postgre-backend:5000
      PEER_SERVICE_URLS: tru_so=http://tru-so-service:5000,mysql=http://mysql-service:5000
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token-change-in-production}
    ports:
      - "${POSTGRE_SERVICE_PORT:-5012}:5000"
    depends_on:
      - postgre-backend
    networks:
      - db-cluster

  tru-so-frontend:
    build:
      context: ./tru_so/frontend
      dockerfile: Dockerfile
      args:
        API_UPSTREAM: http://tru-so-backend:5000
    container_name: tru-so-frontend
    restart: unless-stopped
    ports:
      - "${CENTRAL_FRONTEND_PORT:-3000}:80"
    depends_on:
      - tru-so-backend
    networks:
      - db-cluster

  mysql-frontend:
    build:
      context: ./mysql/frontend
      dockerfile: Dockerfile
      args:
        API_UPSTREAM: http://mysql-backend:5000
    container_name: mysql-frontend
    restart: unless-stopped
    ports:
      - "${CN01_FRONTEND_PORT:-3001}:80"
    depends_on:
      - mysql-backend
    networks:
      - db-cluster

  postgre-frontend:
    build:
      context: ./postgre/frontend
      dockerfile: Dockerfile
      args:
        API_UPSTREAM: http://postgre-backend:5000
    container_name: postgre-frontend
    restart: unless-stopped
    ports:
      - "${CN02_FRONTEND_PORT:-3002}:80"
    depends_on:
      - postgre-backend
    networks:
      - db-cluster

volumes:
  mssql-data:
  mysql-data:
  postgres-data:
  redis-data:

networks:
  db-cluster:
    driver: bridge
