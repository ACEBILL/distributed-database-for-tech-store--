<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý chi nhánh</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="topbar">
        <div>
            <div class="app-title">Quản lý chi nhánh</div>
            <div class="app-subtitle">Frontend client dùng dữ liệu từ Flask API</div>
        </div>
        <button id="refreshBtn" class="btn">Tải lại</button>
    </header>

    <main class="layout">
        <section class="summary-grid">
            <div class="metric">
                <span class="metric-label">Sản phẩm</span>
                <strong id="productCount">...</strong>
            </div>
            <div class="metric">
                <span class="metric-label">Nhân viên</span>
                <strong id="employeeCount">...</strong>
            </div>
            <div class="metric">
                <span class="metric-label">Chi nhánh</span>
                <strong id="branchCount">...</strong>
            </div>
        </section>

        <section class="section">
            <div class="section-header">
                <h1>Chi nhánh</h1>
                <span class="status" id="branchStatus">Đang tải</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Mã</th>
                            <th>Tên chi nhánh</th>
                            <th>Hệ CSDL</th>
                            <th>Trạng thái DB</th>
                        </tr>
                    </thead>
                    <tbody id="branchRows"></tbody>
                </table>
            </div>
        </section>

        <section class="section">
            <div class="section-header">
                <h1>Sản phẩm</h1>
                <span class="status" id="productSource">Đang tải</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Mã</th>
                            <th>Tên sản phẩm</th>
                            <th>Loại</th>
                            <th>Nhà cung cấp</th>
                            <th class="right">Giá</th>
                            <th class="right">Giảm giá</th>
                        </tr>
                    </thead>
                    <tbody id="productRows"></tbody>
                </table>
            </div>
        </section>

        <section class="section">
            <div class="section-header">
                <h1>Nhân viên</h1>
                <span class="status" id="employeeStatus">Đang tải</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Mã</th>
                            <th>Họ tên</th>
                            <th>Phòng ban</th>
                            <th>Chức vụ</th>
                            <th class="right">Lương</th>
                            <th>Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody id="employeeRows"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
