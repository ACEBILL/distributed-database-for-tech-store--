server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream "__API_UPSTREAM__";
    set $api_fallback_upstream "__API_FALLBACK_UPSTREAM__";

    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-store";

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_fallback;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @api_fallback {
        proxy_pass $api_fallback_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Branch-Failover 1;
    }
}
